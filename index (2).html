["Uniform vectors","start:step:end builds evenly spaced values. The default step is 1. linspace(a,b,n) gives n points.","start:step:end ينشئ قيمًا متساوية البعد، والخطوة الافتراضية 1. وlinspace(a,b,n) تعطي n نقطة.","v = 0:0.5:2\nw = linspace(0,1,5)"],
["Two-dimensional matrices","Type rows separated by semicolons.","اكتب الصفوف مفصولة بفواصل منقوطة.","A = [1 2 3; 4 5 6; 7 8 9]"],
["Indexing and the colon","A(i,j) one element. A(n,:) row n. A(:,n) column n. A(m:n,p:q) a sub-matrix. end means the last index.","A(i,j) عنصر واحد. A(n,:) الصف n. A(:,n) العمود n. A(m:n,p:q) مصفوفة جزئية. وend تعني آخر فهرس.","A = [1 2 3; 4 5 6; 7 8 9];\nA(2,3)\nA(2,:)\nA(:,1)\nA(1:2,2:3)\nA(end,end)"],

["Replacing and adding elements","Assign to A(i,j), a block A(m:n,p:q), a whole row A(k,:) or a whole column A(:,k). The new values must match the selected size (a column needs a column vector). If you assign outside the current size, MATLAB enlarges the matrix and fills the gap with zeros.","اسند قيمة إلى A(i,j) أو كتلة A(m:n,p:q) أو صف كامل A(k,:) أو عمود كامل A(:,k). ويجب أن يطابق حجم القيم الجديدة الحجم المحدد (العمود يحتاج متجهًا عموديًا). وإذا أسندت خارج الحجم الحالي يكبّر ماتلاب المصفوفة ويملأ الفراغ بالأصفار.","A = zeros(3,4);\nA(3,4) = 8\nA(2:3,3:4) = 6\na = [1 3 5 6; 4 6 7 -1];\na(3,:) = [1:4]\na = [1 3 5 6; 4 6 7 -1];\na(:,5) = [10; 11]\na = [1 3 5 6; 4 6 7 -1];\na(5,6) = 100"],

["Standard matrices","zeros(m,n) all zeros. ones(m,n) all ones. eye(n) is square with ones on the main diagonal. rand(m,n) gives random numbers between 0 and 1 (round(rand(m,n)) gives random 0s and 1s). magic(n) is the magic square: every row, column and main diagonal has the same sum. They can be joined, e.g. [ones(2,3); zeros(2,3)].","zeros(m,n) كلها أصفار. ones(m,n) كلها واحدات. eye(n) مربعة وعناصر قطرها الرئيسي واحد. rand(m,n) أعداد عشوائية بين 0 و1 (و round(rand(m,n)) تعطي أصفارًا وواحدات عشوائية). magic(n) المصفوفة السحرية: مجموع كل صف وعمود والقطر الرئيسي متساوٍ. ويمكن دمجها مثل [ones(2,3); zeros(2,3)].","Z = zeros(2,5)"],
["Matrix arithmetic","A scalar with a matrix acts on every element (a*2, a+2, a-2, a^2). A + B and A - B need equal sizes and work element by element. Element-wise operators: .* , .^ , ./ (equal sizes). Algebraic product A*B needs columns of A = rows of B. A size mismatch gives an error.","العدد مع المصفوفة يؤثر في كل عنصر (a*2 وa+2 وa-2 وa^2). والجمع والطرح A + B يلزمهما تساوي الحجم ويعملان عنصرًا بعنصر. العمليات العنصرية: .* و .^ و ./ (بحجمين متساويين). والضرب الجبري A*B يلزمه عدد أعمدة A = عدد صفوف B. وعدم التوافق يعطي خطأ.","a = [2 3; 6 10];\nb = [1 3; 7 10];\na*2, a+2, a-2, a^2\na+b\na.*b\na.^b\na./b\na*b\nc = [1 7 3];\na+c"],
["Statistics","mean, max, min, sum, median, std. On a matrix they work on each column.","mean وmax وmin وsum وmedian وstd. وعلى المصفوفة تعمل على كل عمود.","v = [4 8 1 9];\nmean(v), median(v), std(v)\nmax(v), min(v), sum(v)"],
["Linear algebra","det, inv, trace, and A\\b to solve A x = b. eig gives the eigenvalues (real ones only here).","det وinv وtrace وA\\b لحل A x = b. والدالة eig تعطي القيم الذاتية (الحقيقية فقط هنا).","A = [2 1; 1 3];\ndet(A)\ninv(A)\ntrace(A)\neig(A)\nA\\[3; 5]"],

["Writing algebra in MATLAB","a−3b is a-3*b; c²−10 is c^2-10; (a²+b²)/12 is (a^2+b^2)/12; M(7d−8g) is M*(7*d-8*g). Parentheses first, then ^, then * /, then + −, left to right. A/B+C is not A/(B+C).","a−3b تُكتب a-3*b، وc²−10 تُكتب c^2-10، و(a²+b²)/12 تُكتب (a^2+b^2)/12، وM(7d−8g) تُكتب M*(7*d-8*g). الأقواس أولًا ثم ^ ثم * / ثم + − من اليسار لليمين. والتعبير A/B+C يختلف عن A/(B+C).","a=2; b=3;\na-3*b\n(a^2+b^2)/12\n6/2+1\n6/(2+1)"],

{o:`ماتلاب (MATLAB) اختصار Matrix Laboratory، وهي لغة عالية المستوى للحسابات والبرمجة تعتمد على المصفوفة كشكل أساسي لتخزين البيانات؛ فكل متغير مصفوفة حتى لو كان عددًا مفردًا (Scalar). تُستخدم في الحسابات الرياضية، وتحليل البيانات، والرسوم العلمية، ومعالجة الإشارة والصور، وأنظمة التحكم.`,r:[
[`ما هو MATLAB`,`اسمه اختصار Matrix Laboratory أي «المختبر المصفوفي»، وهو لغة برمجة للحسابات العلمية والهندسية. فكرته الأساسية أن كل متغير يُخزَّن كمصفوفة، حتى العدد الواحد يُعدّ مصفوفة بحجم 1×1 تسمى Scalar؛ ولهذا يسهل عليه إجراء العمليات على مجموعات كبيرة من الأرقام دفعة واحدة.`],
[`نبذة تاريخية`,`في منتصف السبعينات طوّر كليف مولر (رئيس قسم الحاسوب في جامعة نيومكسيكو) مكتبتي الفورتران EISPACK و LINPACK لحسابات المصفوفات، وكتب برنامجًا للوصول إليهما وسماه MATLAB. وساعده جاك ليتل في تخطيط البرنامج، وهو مؤسس شركة MathWorks.`],
[`تطبيقات MATLAB`,`أنظمة التحكم، معالجة الإشارة الرقمية، النظريات العددية التقريبية، معالجة الصور، الرادار، الروبوت، الإلكترونيات، الاتصالات.`],

[`مكونات النافذة الرئيسية`,`1) شريط العنوان: يحمل رمز البرنامج واسمه. 2) شريط القوائم Menu Bar: من File إلى Help. 3) شريط الأدوات Tools Bar: رموز لبعض الأوامر. 4) شريط المهام السفلي: Start طريق مختصر للأوامر، و Ready تعني أن البرنامج جاهز للعمل.`],

[`=`,`عامل الإسناد وليس معادلة رياضية: ينفّذ ماتلاب الطرف الأيمن أولًا ثم يضع الناتج في المتغير المكتوب على اليسار. فالأمر x = x + 1 مقبول ويعني: خذ قيمة x الحالية، أضف إليها 1، وخزّن الناتج في x من جديد.`,`x = 5`],
[`ans`,`إذا كتبت تعبيرًا ولم تسنده إلى متغير (مثل 3+4) يحفظ ماتلاب ناتجه تلقائيًا في متغير اسمه ans ويمكنك استخدامه في الأمر التالي، لكن قيمته تتغير مع كل ناتج جديد.`,`3 + 4\nans * 2`],
[`;`,`إذا وضعت فارزة منقوطة في نهاية الأمر فسيُنفَّذ الأمر ويُحفظ الناتج في الذاكرة، لكن ماتلاب لن يطبعه على الشاشة. وبدونها يُطبع الناتج. وهي مفيدة عند التعامل مع مصفوفات كبيرة.`,`a = 3;`],

[`clc`,`تعني Clear Command Window: تمسح الشاشة (نافذة الأوامر) فقط لتبدو نظيفة، لكن المتغيرات تبقى محفوظة في الذاكرة ويمكنك الاستمرار في استخدامها.`],

[`who , whos`,`who تعرض أسماء المتغيرات المخزنة حاليًا في مساحة العمل، و whos تعرضها مع تفاصيل أكثر مثل حجم كل متغير.`],
[`↑ ↓`,`اضغط ↑ في سطر الأوامر لاسترجاع الأمر السابق (ومزيدًا من الضغط للأقدم)، و ↓ للرجوع نحو الأحدث؛ فتعدّل الأمر وتعيد تنفيذه دون إعادة كتابته.`],
[`النوافذ الأربع`,`Command Window: لكتابة الأوامر وعرض النتائج. Workspace: أسماء المتغيرات وقيمها وأحجامها. Current Folder: المجلد الحالي وملفاته. Command History: سجل الأوامر المنفذة لإعادة تنفيذها.`],

[`قواعد اسم الملف`,`عند حفظ الملف النصي لا يبدأ اسمه برقم، ولا يطابق اسم أمر موجود في ماتلاب (مثل sin)، ولا يحتوي مسافات ولا رموزًا مثل * & - +؛ لأن ذلك يسبب أخطاء عند تشغيله.`],
[`لا حاجة للإعلان`,`لا تحتاج إلى تعريف المتغيرات أو تحديد نوع بياناتها قبل استخدامها؛ يكفي أن تسند قيمة (x = 5) فيُنشئ ماتلاب المتغير. وتُكتب الأوامر بأحرف صغيرة، فالأمر Sin لا يساوي sin.`]]},
{o:`تتناول المحاضرة الثوابت والمتغيرات والعمليات الحسابية والدوال المكتبية. تُكتب الجملة الحسابية بالشكل: متغير = تعبير حسابي.`,r:[
[`+  -  *  /`,`العمليات الحسابية الأربع: الجمع والطرح والضرب والقسمة. تذكّر أن الضرب يحتاج علامة * صريحة دائمًا.`,`7/2`],
[`^`,`الأس أو القوة: 2^3 تعطي 8، و x^0.5 تساوي الجذر التربيعي لـ x.`,`2^3`],
[`\\`,`القسمة اليسارية: a\\b تعني b÷a (أي المقسوم عليه على اليسار). وتُستخدم مع المصفوفات لحل نظام المعادلات Ax = b بكتابة A\\b.`,`2\\8`],
[`( )`,`الأقواس تُنفَّذ أولًا لأن لها أعلى أسبقية، وتُستخدم أيضًا لتمرير المدخل إلى الدالة مثل sqrt(9)، ولفهرسة عناصر المصفوفة مثل A(2,3).`,`(2+3)*4`],
[`ترتيب الأسبقية`,`عند وجود عدة عمليات في تعبير واحد تُنفَّذ بهذا الترتيب: الأقواس () ثم الأس ^ ثم الضرب والقسمة * / \\ ثم الجمع والطرح + -. وعند تساوي المستوى يُنفَّذ من اليسار إلى اليمين. مثال: 2+3*4 تعطي 14 وليس 20، و A/B+C تختلف عن A/(B+C).`,`2 + 3*4^2\n6/2+1\n6/(2+1)`],
[`كتابة الجبر`,`في الجبر نكتب 3b ونفهم أنها 3×b، أما ماتلاب فلا يقبل الضرب الضمني، فيجب كتابتها 3*b. وكذلك c² تُكتب c^2، و a−3b تُكتب a-3*b.`,`a=2; b=3;\na-3*b\n(a^2+b^2)/12`],
[`E أو e`,`الصيغة العلمية: الحرف E يعني «×10 مرفوعة إلى القوة»؛ فـ 2.0E3 تساوي 2×10³ = 2000، و 4.7E-3 تساوي 0.0047. لا تضع مسافات داخل العدد.`,`2.0E3\n4.7E-3`],
[`pi`,`ثابت جاهز قيمته π ≈ 3.14159؛ اكتبه pi دون أقواس، مثل sin(pi/2) أو 2*pi*r.`,`pi`],
[`i , j`,`الوحدة التخيلية √−1 (الأعداد المركبة من المنهج، لكنها غير محاكاة هنا).`],
[`realmin , realmax , bitmax`,`ثوابت حدية يخزنها الحاسوب: realmin أصغر عدد حقيقي موجب، realmax أكبر عدد حقيقي، bitmax أكبر عدد صحيح يمكن تمثيله بدقة، و eps أصغر فرق بين عددين متجاورين (يفيد في تجنب القسمة على صفر).`,`realmax\nrealmin`],
[`' '`,`علامتا اقتباس مفردتان تحيطان بالنص ليُعامل نصًا (String) لا اسم متغير، مثل s = 'Hello'. ولا يجوز وضع اقتباس مفرد داخل النص نفسه.`,`Dept = 'Physics'`],
[`true , false`,`ثابتان منطقيان: true قيمتها 1 (صحيح) و false قيمتها 0 (خطأ)، وتنتجهما عمليات المقارنة وتُستخدم في الشروط.`],
[`قواعد أسماء المتغيرات`,`عند تسمية متغير: ماتلاب حساس لحالة الأحرف (A تختلف عن a)، ويجب أن يبدأ الاسم بحرف، ويتكون من حروف وأرقام وشرطة سفلية _ فقط بحد أقصى 63 رمزًا، ولا يكون كلمة محجوزة (if, end, for, break, else, global, return, function) ولا اسم دالة موجودة مثل sin.`],
[`sqrt(x)`,`الجذر التربيعي: sqrt(16) تعطي 4.`,`sqrt(16)`],
[`abs(x)`,`القيمة المطلقة (تحذف الإشارة السالبة): abs(-5) تعطي 5.`,`abs(-7)`],
[`exp(x)`,`الدالة الأسية e^x حيث e ≈ 2.718؛ فـ exp(1) تعطي 2.7183. (لا نكتب e^x مباشرة بل exp(x).)`,`exp(1)`],
[`log(x) , log10(x)`,`log هو اللوغاريتم الطبيعي ln (الأساس e)، و log10 هو اللوغاريتم العشري. انتبه: log(100) لا تعطي 2 بل 4.6052، أما log10(100) فتعطي 2.`,`log(exp(2))\nlog10(1000)`],
[`sin cos tan`,`الدوال المثلثية تتوقع الزاوية بالراديان وليس بالدرجات. لتحويل الدرجات إلى راديان اضرب في pi/180، فمثلًا sin(30*pi/180) تعطي 0.5.`,`sin(pi/2)\ncos(60*pi/180)`],
[`atan(x)`,`معكوس الظل tan⁻¹ ويعطي الزاوية بالراديان: atan(1) تعطي 0.7854 (أي 45°). وتوجد asin و acos بالمثل.`,`atan(1)`],
[`fix  floor  ceil  round`,`أربع طرق للتقريب إلى عدد صحيح: fix نحو الصفر (تحذف الكسر)، floor نحو الأسفل، ceil نحو الأعلى، round لأقرب عدد صحيح. عند 2.6 تعطي بالترتيب 2 و 2 و 3 و 3، وعند −2.6 تعطي −2 و −3 و −2 و −3.`,`fix(-2.7), floor(-2.7)\nceil(-2.2), round(2.5)`],
[`mod(a,b) , rem(a,b)`,`mod(a,b) و rem(a,b) تعطيان باقي قسمة a على b؛ فـ mod(10,3) تعطي 1. وتختلفان فقط عند الأعداد السالبة.`,`mod(10,3)`],
[`sign(x)`,`تعطي إشارة العدد: 1 إذا كان موجبًا، 0 إذا كان صفرًا، و −1 إذا كان سالبًا.`],
[`isprime  primes  factor`,`isprime(n) تعيد 1 إذا كان n عددًا أوليًا و 0 إن لم يكن. primes(n) تسرد كل الأعداد الأولية حتى n. factor(n) تعطي العوامل الأولية للعدد، فـ factor(12) تعطي 2 2 3.`,`isprime(7)\nprimes(20)\nfactor(60)`],
[`gcd , lcm`,`gcd(a,b) القاسم المشترك الأكبر، و lcm(a,b) المضاعف المشترك الأصغر؛ فـ gcd(12,18) تعطي 6 و lcm(4,6) تعطي 12.`,`gcd(12,18)\nlcm(4,6)`],
[`factorial(n)`,`مضروب العدد: factorial(5) تعطي 5! = 120.`,`factorial(5)`],
[`.*  ./  .^`,`النقطة قبل العامل تجعل العملية تُنفَّذ على كل عنصر من المتجه على حدة (عنصرًا بعنصر). نحتاجها عند حساب دالة لمتجه كامل، فمثلًا x.^2 تربّع كل عنصر في x، أما x^2 فتعني ضرب المصفوفة بنفسها.`,`x = 1:4;\nx.^2`],
[`أنواع الثوابت`,`أنواع الثوابت: عددية (صحيحة مثل 23 و 0 و −4، وحقيقية مثل 600.04، وعلمية مثل 2.0E3، وعقدية مثل 6-9i)، ورمزية وهي نص بين ' '، ومنطقية وهي 1 و 0.`],
[`المتغيرات العددية والرمزية`,`المتغير العددي (Numerical) يحمل عددًا (صحيحًا أو حقيقيًا أو علميًا أو عقديًا)، ويُسمّى بحرف أو أكثر يليه أرقام أو _ حتى 63 رمزًا، مثل Ali_Ahmed و X2 و ks. والمتغير الرمزي (String) يحمل نصًا بين ' '.`,`X2 = 15.5\nks = 'My birthday = 1970'`],
[`المقارنة تنتج ثابتًا منطقيًا`,`أي مقارنة (مثل 5>3) تعطي 1 (true) إذا تحققت أو 0 (false) إن لم تتحقق، ويُعدّ الناتج ثابتًا منطقيًا.`,`3 < 3\n-5 < 6\n0 > 5`],
[`real(x) , imag(x)`,`استخراج الجزء الحقيقي والجزء الخيالي للعدد العقدي c = 2-3i تعطيان 2 و −3. (الأعداد العقدية غير محاكاة هنا، فالمثال للمرجع فقط.)`],
[`الجملة الحسابية`,`متغير = تعبير حسابي. والتعبير يتكون من ثوابت ومتغيرات ورموز حسابية. أمثلة التحويل: a−3b تُكتب a-3*b ، و c²−10 تُكتب c^2-10 ، و (a²+b²)/12 تُكتب (a^2+b^2)/12 ، و M(7d−8g) تُكتب M*(7*d-8*g).`,`a=2; b=3; c=4; M=2; d=1; g=1;\na-3*b\nc^2-10\n(a^2+b^2)/12\nM*(7*d-8*g)`]]},

[`المسافة أو ,`,`المسافة أو الفاصلة تفصل بين العناصر في الصف الواحد (أي بين الأعمدة)؛ فـ [2 4 5] و [2,4,5] هما الشيء نفسه (متجه صفّي).`,`r = [2 4 5 6 7]\nr = [2,4,5,6,7]`],
[`;  داخل [ ]`,`الفارزة المنقوطة داخل القوسين تنتقل إلى صف جديد؛ فـ [2;4;5] متجه عمودي، و [1 2 3; 4 5 6] مصفوفة بصفين وثلاثة أعمدة. ويمكن الضغط على Enter بين الصفوف بدل الفارزة المنقوطة.`,`c = [2;4;5]\nA = [1 2 3; 4 5 6; 7 8 9]`],
[`m:q:n`,`ينشئ متجهًا منتظمًا: m أول عنصر، q الخطوة بين كل عنصر والذي يليه، n آخر قيمة. إذا حُذفت الخطوة فهي 1 (مثل 1:5)، ويجوز أن تكون سالبة للعدّ التنازلي مثل 10:-2:0.`,`x = [1:2:13]\nz = [-3:7]\nxa = [21:-3:6]`],

[`for k = f:s:t`,`k هو متغير الحلقة (يجوز أن يكون i أو j أو m …)، و f قيمته في الدورة الأولى، و s مقدار الزيادة بعد كل دورة، و t قيمته في الدورة الأخيرة. مثال: for k = 1:2:7 تعطي k = 1 ثم 3 ثم 5 ثم 7.`,`for k=1:3:10\n  x = k^2\nend`],

[`for k = [4 8 -9 0 7]`,`يمكن أن تأخذ k قائمة قيم خاصة تكتبها بنفسك بدل المدى المنتظم، وتأخذ قيمة واحدة منها في كل دورة.`,`for k=[4 8 -9 0 7]\n  disp(k)\nend`],

[`S = S + …`,`المجمّع (Accumulator): نصفّره قبل الحلقة S=0 ثم نضيف إليه حدًّا جديدًا في كل دورة S = S + k، فإذا انتهت الحلقة صار فيه المجموع.`,`n = 4; S = 0;\nfor k = 1:n\n  S = S + (-1)^k*k/2^k;\nend\nfprintf('The sum is: %f\\n',S)`],
[`A = [ ]`,`نعرّف مصفوفة فارغة A = [ ] قبل الحلقة ثم نملؤها أثناء الدورات، لأن ماتلاب يحتاج متغيرًا موجودًا ليضيف عليه.`],
[`mult(i,j) = i*j`,`الإسناد إلى عنصر بالفهرس داخل الحلقة: mult(i,j) = i*j يضع القيمة في الصف i والعمود j، فتُبنى المصفوفة عنصرًا بعنصر.`,`for i=1:5\n  for j=1:5\n    mult(i,j) = i*j;\n  end\nend\ndisp(mult)`],

[`break`,`تُخرج من الحلقة فورًا عند تحقق شرط داخل if. في الحلقات المتداخلة تخرج من الحلقة التي تحتويها فقط. تعطي حلقة for ذات s>250 النتيجتين i=22 و s=253.`,`s = 0;\nfor i = 1:100\n  s = s + i;\n  if s > 250\n    break\n  end\nend\ni, s`],
[`واجب: ناتج حلقتين متداخلتين`,`ما ناتج البرنامج عند n=3 و m=3؟ الحلقة الخارجية i والداخلية j، وكل عنصر result(i,j) = i^j. الجواب: الصف 1: 1 1 1، الصف 2: 2 4 8، الصف 3: 3 9 27.`,`n = 3; m = 3;

disp(result)`],

fprintf('%g cm\n', c)`],

v`],
[`واجب: العد التنازلي والتصاعدي`,`اطبع الأعداد من 10 إلى 1 بتناقص 2، ثم من 0 إلى 10 بزيادة 2.`,`for k = 10:-2:1

function guide(){const t=$('gtabs'),g=$('gbody');t.textContent='';g.textContent='';
 const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=txt;return e};
 G.forEach((s,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=s.t[L()];b.setAttribute('aria-selected',i==gsec);b.onclick=()=>{gsec=i;guide()};t.appendChild(b)});
 const B=BK[gsec],bx=mk('div','bk');bx.dir='rtl';bx.lang='ar';
 bx.append(mk('h3','','ملزمة المراجعة — '+G[gsec].t[1]),mk('p','note',B.o),mk('h3','','شرح الرموز والمعاملات والدوال وقواعد الصياغة'));
 B.r.forEach(r=>{const d=mk('div','gi');d.append(mk('b','code',r[0]),mk('p','',r[1]));if(r[2]){d.append(mk('pre','code gc',r[2]));const tb=mk('button','pri sm','▷ جرّب');tb.style.cssText='margin-block-end:4px';tb.onclick=()=>tryIt(r[2]);d.append(tb)}bx.appendChild(d)});
 g.append(bx)}
function tryIt(code){$('scr').value=code;$('mScr').hidden=false;run(code,true,null)}
function flush(err){['con','sout'].forEach(id=>{const c=$(id);c.textContent=out;if(err){const x=document.createElement('span');x.className='err';x.textContent='Error: '+err;c.appendChild(x)}c.scrollTop=c.scrollHeight})}
function run(code,fresh,echo){if(fresh||!env){env=new Map();fig=newFig();out=''}
 if(echo)out+='>> '+(echo===true?code:echo)+'\n';steps=0;let err=null;plotted=0;
 try{const b=block(split(code),0,[]);exec(b.nodes)}catch(e){err=e.message||String(e)}
 flush(err);try{if(!err&&plotted&&Object.values(fig.axes).some(a=>a.s.length)){$('mFig').hidden=false;render()}else render()}catch(e){flush(String(e.message||e))}}
function showMsg(m,t){$('mt').textContent=t||T[lang].title;$('mm').textContent=m;$('mMsg').hidden=false}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.hidden=true)}
function setLang(l){lang=l;const d=document.documentElement;d.lang=l;d.dir=l=='ar'?'rtl':'ltr';document.title=T[l].title;$('langSel').value=l;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]);
 document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=T[l][e.dataset.p]);
 document.querySelectorAll('[data-ti]').forEach(e=>{e.title=T[l][e.dataset.ti];e.setAttribute('aria-label',T[l][e.dataset.ti])});
 guide();if(fig&&!Object.values(fig.axes).some(a=>a.s.length))render()}
function setTheme(t){document.documentElement.dataset.theme=t;$('themeBtn').textContent=t=='dark'?'☀':'☾';$('thSel').value=t;try{localStorage.setItem('mls-theme',t)}catch(e){}if(fig)render()}
function applySt(){const r=document.documentElement.style;r.setProperty('--fs',ST.fs+'px');r.setProperty('--tc',ST.tc||'inherit');$('fszv').textContent=ST.fs;if(fig)render()}

/* command line: history and multi-line blocks (for/while/if/switch wait for their "end") */
let pend='',hist=[],hp=0;
function go(){const raw=$('cmd').value;if(!raw.trim())return;$('cmd').value='';hist.push(raw);hp=hist.length;
 const code=pend?pend+'\n'+raw:raw;
 try{block(split(code),0,[])}catch(e){if(/Missing 'end'/.test(e.message)){pend=code;out+='>> '+raw+'\n';flush();$('pr').textContent='  ';return}}
 pend='';$('pr').textContent='>>';run(code,false,raw)}
$('cmd').onkeydown=e=>{if(e.key=='Enter')go();else if(e.key=='ArrowUp'&&hp>0){e.preventDefault();$('cmd').value=hist[--hp]}else if(e.key=='ArrowDown'){e.preventDefault();hp=Math.min(hp+1,hist.length);$('cmd').value=hist[hp]||''}};
$('go').onclick=go;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{b.closest('.modal').hidden=true});
document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target==m)m.hidden=true});
$('setBtn').onclick=()=>{$('mSet').hidden=false};
$('guideBtn').onclick=()=>{$('mSet').hidden=true;guide();$('mGuide').hidden=false};
$('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark');
$('thSel').onchange=e=>setTheme(e.target.value);
$('langSel').onchange=e=>setLang(e.target.value);
$('fsz').oninput=e=>{ST.fs=+e.target.value;applySt()};
$('lcol').oninput=e=>{ST.lc=e.target.value;applySt()};$('lreset').onclick=()=>{ST.lc=null;applySt()};
$('tcol').oninput=e=>{ST.tc=e.target.value;applySt()};$('treset').onclick=()=>{ST.tc=null;applySt()};
function runScr(){run($('scr').value,false,null)}
$('scrRun').onclick=runScr;$('scrClr').onclick=()=>{$('scr').value='';$('scr').focus()};
$('scrBtn').onclick=()=>{$('mScr').hidden=false;setTimeout(()=>$('scr').focus(),30)};$('figBtn').onclick=()=>{$('mFig').hidden=false;render()};$('conClr').onclick=()=>{out='';flush();$('cmd').focus()};
$('scr').onkeydown=e=>{if(e.key=='Tab'){e.preventDefault();const t=e.target;t.setRangeText('  ',t.selectionStart,t.selectionEnd,'end')}else if(e.key=='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();runScr()}};
document.addEventListener('keydown',e=>{if(e.key=='Escape'){const v=[...document.querySelectorAll('.modal:not([hidden])')];if(v.length)v[v.length-1].hidden=true}else if(e.key=='F5'&&document.activeElement===$('scr')){e.preventDefault();runScr()}});
try{new ResizeObserver(()=>{try{Plotly.Plots.resize($('plot'))}catch(e){}}).observe($('plot'))}catch(e){}
let th='light';
env=new Map();fig=newFig();setTheme(th);setLang('ar');render();$('cmd').focus();
</script>
</body>
</html>
