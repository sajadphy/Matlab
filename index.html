["; ... %","A semicolon ; hides the output of a command. Three dots ... continue a command on the next line. % starts a comment that MATLAB ignores.","الفاصلة المنقوطة ; تخفي ناتج الأمر. النقاط الثلاث ... تكمل الأمر في السطر التالي. وعلامة % تبدأ تعليقًا يتجاهله ماتلاب.","a = 3;      % no output\nb = 1 + 2 + ...\n    3"]]},
{t:['Lecture 2: Variables & arithmetic','المحاضرة 2: المتغيرات والحساب'],i:[
["Numerical constants","Integers (12), real numbers (3.75) and scientific notation (2.0E3 means 2000).","أعداد صحيحة (12) وحقيقية (3.75) وبالصيغة العلمية (2.0E3 تعني 2000).","2.0E3"],
["Special constants","pi, realmin (smallest positive real), realmax (largest real) and bitmax (largest exact integer). The imaginary units i and j (√−1) belong to the course, but complex numbers are not simulated here."+NS[0],"pi وrealmin (أصغر عدد حقيقي موجب) وrealmax (أكبر عدد حقيقي) وbitmax (أكبر عدد صحيح دقيق). الوحدتان التخيليتان i وj (√−1) من المنهج، لكن الأعداد المركبة غير محاكاة هنا."+NS[1],"pi\nrealmax\nrealmin"],
["String and logical constants","A string is text in single quotes. Logical constants are 1 (true) and 0 (false).","النص يُكتب بين علامتي اقتباس مفردتين. والثوابت المنطقية: 1 (صحيح) و0 (خطأ).","s = 'Hello'\nt = true\nf = false"],
["Variable names","Names are case-sensitive (A and a differ), must start with a letter, can have up to 63 characters (letters, digits, _) and cannot be a reserved keyword such as for, if, end.","الأسماء حساسة لحالة الأحرف (A تختلف عن a)، وتبدأ بحرف، وحتى 63 خانة (حروف وأرقام و _)، ولا تكون كلمة محجوزة مثل for وif وend.","speed_1 = 20"],
["Operator precedence","Order of evaluation: parentheses (), then power ^, then * / \\ , then + - . Equal levels go left to right.","ترتيب التنفيذ: الأقواس (), ثم الأس ^, ثم * / \\ , ثم + - . وعند التساوي من اليسار لليمين.","2 + 3*4^2\n(2 + 3)*4^2"],
["Library functions","sqrt, abs, exp, log (natural), log10, sin, cos, tan, atan (angles in radians). real and imag extract parts of a number (complex numbers themselves are not simulated).","sqrt وabs وexp وlog (طبيعي) وlog10 وsin وcos وtan وatan (الزوايا بالراديان). والدالتان real وimag تستخرجان أجزاء العدد (الأعداد المركبة نفسها غير محاكاة).","sqrt(16)\nexp(1)\nlog10(1000)\nsin(pi/2)"],
["Rounding, remainder, primes","fix (toward zero), floor (down), ceil (up), round (nearest). mod(a,b) and rem(a,b) give the remainder. isprime(n) returns 1 for a prime.","fix (نحو الصفر) وfloor (للأسفل) وceil (للأعلى) وround (الأقرب). وmod(a,b) وrem(a,b) تعطيان الباقي. وisprime(n) تعيد 1 للعدد الأولي.","fix(-2.7), floor(-2.7), ceil(-2.2), round(2.5)\nmod(10,3)\nisprime(7)"]]},
{t:['Lecture 3: Arrays & matrices','المحاضرة 3: المصفوفات'],i:[
["Row and column vectors","Row: square brackets with spaces or commas. Column: semicolons (or line breaks).","الصف: أقواس مربعة مع مسافات أو فواصل. العمود: فواصل منقوطة (أو أسطر جديدة).","r = [1 2 3]\nc = [1; 2; 3]"],
["Uniform vectors","start:step:end builds evenly spaced values. The default step is 1. linspace(a,b,n) gives n points.","start:step:end ينشئ قيمًا متساوية البعد، والخطوة الافتراضية 1. وlinspace(a,b,n) تعطي n نقطة.","v = 0:0.5:2\nw = linspace(0,1,5)"],
["Two-dimensional matrices","Type rows separated by semicolons.","اكتب الصفوف مفصولة بفواصل منقوطة.","A = [1 2 3; 4 5 6; 7 8 9]"],
["Indexing and the colon","A(i,j) one element. A(n,:) row n. A(:,n) column n. A(m:n,p:q) a sub-matrix. end means the last index.","A(i,j) عنصر واحد. A(n,:) الصف n. A(:,n) العمود n. A(m:n,p:q) مصفوفة جزئية. وend تعني آخر فهرس.","A = [1 2 3; 4 5 6; 7 8 9];\nA(2,3)\nA(2,:)\nA(:,1)\nA(1:2,2:3)\nA(end,end)"],
["Size and shape","length, size, numel, reshape(A,m,n), diag, transpose with ', sort, find.","length وsize وnumel وreshape(A,m,n) وdiag والمنقول بالرمز ' وsort وfind.","A = [1 2 3; 4 5 6; 7 8 9];\nsize(A)\nnumel(A)\nreshape(1:6,2,3)\nA'\nfind([0 3 0 5])"],
["Statistics","mean, max, min, sum, median, std. On a matrix they work on each column.","mean وmax وmin وsum وmedian وstd. وعلى المصفوفة تعمل على كل عمود.","v = [4 8 1 9];\nmean(v), median(v), std(v)\nmax(v), min(v), sum(v)"],
["Linear algebra","det, inv, trace, and A\\b to solve A x = b. eig gives the eigenvalues (real ones only here).","det وinv وtrace وA\\b لحل A x = b. والدالة eig تعطي القيم الذاتية (الحقيقية فقط هنا).","A = [2 1; 1 3];\ndet(A)\ninv(A)\ntrace(A)\neig(A)\nA\\[3; 5]"],
["Vector products and manipulation","dot (scalar product), cross (vector product of two 3-element vectors), flipud / fliplr (flip), triu / tril (upper / lower triangle), circshift (rotate elements).","dot (الضرب القياسي) وcross (الضرب الاتجاهي لمتجهين من 3 عناصر) وflipud / fliplr (قلب) وtriu / tril (المثلث العلوي / السفلي) وcircshift (تدوير العناصر).","dot([1 2 3],[4 5 6])\ncross([1 0 0],[0 1 0])\nfliplr(1:4)\ncircshift(1:5,2)\ntriu([1 2;3 4])"]]},
{t:['Lecture 4: Input & output','المحاضرة 4: الإدخال والإخراج'],i:[
["input","x = input('prompt') reads a number. input('prompt','s') reads text. A box asks for the value.","x = input('prompt') تقرأ عددًا. وinput('prompt','s') تقرأ نصًا. وتظهر نافذة لإدخال القيمة.","n = input('Enter n: ');\nname = input('Name: ','s');"],
["inputdlg","a = inputdlg('prompt') opens a dialog. The answer is text in a cell: a{1}. Convert with str2double.","a = inputdlg('prompt') تفتح نافذة إدخال، والإجابة نص داخل خلية: a{1}. وحوّلها بـ str2double.","a = inputdlg('Enter a number:');\nx = str2double(a{1})"],
["disp","Shows a value or text without the variable name.","تعرض قيمة أو نصًا دون اسم المتغير.","disp('Result:')\ndisp([1 2; 3 4])"],
["msgbox","Shows a pop-up message: msgbox('text','title').","تعرض رسالة منبثقة: msgbox('text','title').","msgbox('Done','Info')"],
["fprintf","Formatted output. %d integer, %f decimal, %e scientific, %s text, \\n new line. %8.2f means width 8 with 2 decimals. The format repeats for vectors.","إخراج منسق: %d صحيح، %f عشري، %e علمي، %s نص، \\n سطر جديد. و%8.2f تعني عرض 8 برقمين عشريين. ويتكرر التنسيق مع المتجهات.","fprintf('%d squared = %d\\n', 4, 16)\nfprintf('pi = %.3f\\n', pi)\nfprintf('%s has %e\\n', 'x', 12345.6)"]]},
{t:['Lecture 5: Logic & conditions','المحاضرة 5: المنطق والشروط'],i:[
["Relational operators","< <= > >= == ~= compare values and return 1 (true) or 0 (false). Note: = assigns, == compares.","< <= > >= == ~= تقارن القيم وتعيد 1 (صحيح) أو 0 (خطأ). تنبيه: = للإسناد، و== للمقارنة.","3 > 2\n5 == 4\n7 ~= 8"],
["Logical operators","& (AND), | (OR), ~ (NOT). The same as functions: and(a,b), or(a,b), not(a).","& (و) و| (أو) و~ (النفي). ولها دوال مكافئة: and(a,b) وor(a,b) وnot(a).","(3>2) & (5<4)\n(3>2) | (5<4)\n~(3>2)\nand(1,0), or(1,0), not(1)"],
["if ... end","Runs the body only when the condition is true.","ينفذ الجسم فقط عندما يكون الشرط صحيحًا.","x = 5;\nif x > 3\n  disp('big')\nend"],
["if ... else ... end","Chooses between two branches.","يختار بين مسارين.","if mod(4,2) == 0\n  disp('even')\nelse\n  disp('odd')\nend"],
["if ... elseif ... else ... end","Tests conditions in order; the first true branch runs.","يختبر الشروط بالترتيب وينفذ أول مسار صحيح.","g = 72;\nif g >= 90\n  disp('A')\nelseif g >= 70\n  disp('B')\nelse\n  disp('C')\nend"],
["switch ... case ... otherwise ... end","Compares one value with several cases. {a,b} matches either value. otherwise runs when nothing matches.","يقارن قيمة واحدة بعدة حالات. و{a,b} تطابق أيًّا من القيمتين. وotherwise تعمل عند عدم التطابق.","d = 3;\nswitch d\n  case 1\n    disp('one')\n  case {2,3}\n    disp('two or three')\n  otherwise\n    disp('other')\nend"]]},
{t:['Lecture 6: Loops','المحاضرة 6: الحلقات'],i:[
["for ... end","Repeats the body once for each value in the range.","يكرر الجسم مرة لكل قيمة في المدى.","s = 0;\nfor k = 1:10\n  s = s + k;\nend\ndisp(s)"],
["Nested loops","A loop inside a loop. The inner loop completes for every step of the outer loop.","حلقة داخل حلقة. تكتمل الداخلية مع كل خطوة من الخارجية.","for i = 1:3\n  for j = 1:3\n    fprintf('%d ', i*j);\n  end\n  fprintf('\\n');\nend"],
["while ... end","Repeats while the condition is true. The body must change something the condition depends on.","يكرر طالما الشرط صحيح. ويجب أن يغيّر الجسم ما يعتمد عليه الشرط.","n = 1;\nwhile n < 100\n  n = n*2;\nend\ndisp(n)"],
["break","Leaves the loop immediately when a condition is met.","يخرج من الحلقة فورًا عند تحقق شرط.","for k = 1:10\n  if k > 4, break, end\n  disp(k)\nend"]]},
{t:['Lecture 7: Plotting','المحاضرة 7: الرسم'],i:[
["plot(x, y, spec)","2D plot. Line style: - (solid) -- (dashed) : (dotted) -. (dash-dot). Color: r g b c m y k w. Marker: + o * . x s d ^. Example spec: '--r*'.","رسم ثنائي الأبعاد. نمط الخط: - (متصل) -- (متقطع) : (منقط) -. (نقطة وشرطة). اللون: r g b c m y k w. العلامة: + o * . x s d ^. مثال: '--r*'.","x = 0:0.2:6;\nplot(x, sin(x), '--r*')"],
["fplot","fplot('function', limits) plots a function over [xmin xmax]. A handle @(x) works too.","fplot('function', limits) يرسم دالة على [xmin xmax]. ويمكن استخدام @(x) أيضًا.","fplot('x.^2 - 2*x', [-2 4])"],
["Multiple graphs","plot(x1,y1,x2,y2) draws several curves. hold on keeps the current plot; hold off releases it. subplot(m,n,p) makes an m-by-n grid and selects panel p.","plot(x1,y1,x2,y2) يرسم عدة منحنيات. وhold on يبقي الرسم الحالي وhold off يفكه. وsubplot(m,n,p) ينشئ شبكة m×n ويختار اللوحة p.","x = 0:0.1:2*pi;\nsubplot(2,1,1)\nplot(x, sin(x))\nsubplot(2,1,2)\nplot(x, cos(x), 'r')"],
["Annotations","xlabel('x'), ylabel('y'), title('text'), grid on, legend('a','b'), text(x,y,'label'). Also xlim([a b]) and ylim([a b]).","xlabel('x') وylabel('y') وtitle('text') وgrid on وlegend('a','b') وtext(x,y,'label'). وكذلك xlim([a b]) وylim([a b]).","x = 0:0.1:6;\nplot(x, sin(x)); hold on\nplot(x, cos(x), '--')\nxlabel('x'); ylabel('y'); title('Waves')\ngrid on; legend('sin','cos')\ntext(1.5, 1, 'peak')"],
["3D and special plots","plot3(x,y,z) 3D curve. [X,Y] = meshgrid(x,y) then surf(X,Y,Z) a surface. bar(y) vertical bars, barh(y) horizontal bars, hist(data,bins) histogram, pie(values) pie chart.","plot3(x,y,z) منحنى ثلاثي الأبعاد. [X,Y] = meshgrid(x,y) ثم surf(X,Y,Z) سطح. وbar(y) أعمدة رأسية وbarh(y) أفقية وhist(data,bins) مدرج تكراري وpie(values) مخطط دائري.","t = 0:0.1:6*pi;\nplot3(cos(t), sin(t), t)\n[X,Y] = meshgrid(-2:0.25:2);\nsurf(X, Y, X.*exp(-X.^2-Y.^2))\nbar([3 5 2 8]); barh([3 5 2 8])\nhist(rand(1,100), 8); pie([30 20 50])"]]}];

["Name, history, uses","MATLAB = Matrix laboratory (or mathematical laboratory). Cleve Moler (University of New Mexico) built it on the EISPACK and LINPACK Fortran libraries; Jack Little helped design it and founded MathWorks. Uses: control systems, digital signal and image processing, numerical methods, radar, robotics, electronics, communications.","MATLAB اختصار Matrix laboratory (المختبر الرياضي). طوّره كليف مولر (جامعة نيومكسيكو) فوق مكتبتي EISPACK وLINPACK بلغة فورتران، وساعد جاك ليتل في تصميمه وأسّس شركة MathWorks. تطبيقاته: أنظمة التحكم، معالجة الإشارة والصور، الطرائق العددية، الرادار، الروبوت، الإلكترونيات، الاتصالات.",""],
["Script file (M-File)","In MATLAB: File > New > M-File (or Ctrl+N), then Run / F5; the file is saved with the extension .m. File names must not start with a digit, must not be an existing MATLAB command, and cannot contain spaces or symbols such as * & - +. Here: write several lines in the Script panel (opened with the Script button in the top bar) and press Run or Ctrl+Enter.","في MATLAB: File > New > M-File (أو Ctrl+N) ثم Run / F5، ويُحفظ الملف بالامتداد m. يجب ألا يبدأ اسم الملف برقم ولا يكون أمرًا موجودًا في ماتلاب ولا يحوي مسافات أو رموزًا مثل * & - +. هنا: اكتب عدة أسطر في نافذة السكربت المنبثقة (تُفتح بزر Script في الشريط العلوي) ثم اضغط Run أو Ctrl+Enter.","a = [1 2 3; 4 5 6]\nb = exp(a)"],
["No declarations","Variables, constants and data types need no declaration. Commands are written in lowercase. Results appear in the Command Window.","لا حاجة للإعلان عن المتغيرات والثوابت وأنواع البيانات. تُكتب أوامر ماتلاب بحروف صغيرة، وتظهر النتائج في نافذة الأوامر.",""]);

["Reserved words and names","Not allowed as variable names: if, end, for, break, else, global, return, function, or built-in names such as sin and log. The letter l looks like the digit 1. Characters beyond 63 are ignored. Names may use letters, digits and _ only.","لا يجوز استخدام الكلمات المحجوزة كأسماء متغيرات: if وend وfor وbreak وelse وglobal وreturn وfunction، ولا أسماء الدوال مثل sin وlog. الحرف l يشبه الرقم 1. يُهمل ما زاد على 63 رمزًا. تتكون الأسماء من حروف وأرقام و _ فقط.",""],
["Writing algebra in MATLAB","a−3b is a-3*b; c²−10 is c^2-10; (a²+b²)/12 is (a^2+b^2)/12; M(7d−8g) is M*(7*d-8*g). Parentheses first, then ^, then * /, then + −, left to right. A/B+C is not A/(B+C).","a−3b تُكتب a-3*b، وc²−10 تُكتب c^2-10، و(a²+b²)/12 تُكتب (a^2+b^2)/12، وM(7d−8g) تُكتب M*(7*d-8*g). الأقواس أولًا ثم ^ ثم * / ثم + − من اليسار لليمين. والتعبير A/B+C يختلف عن A/(B+C).","a=2; b=3;\na-3*b\n(a^2+b^2)/12\n6/2+1\n6/(2+1)"],

["Rounding and number functions","With x = 2.6 and y = −2.6: fix gives 2 / −2, floor 2 / −3, ceil 3 / −2, round 3 / −3. primes(n) lists primes, factor(n) gives prime factors, gcd and lcm give the greatest common divisor and least common multiple, sign gives the sign.","عند x = 2.6 وy = −2.6: الدالة fix تعطي 2 و −2، وfloor تعطي 2 و −3، وceil تعطي 3 و −2، وround تعطي 3 و −3. وprimes(n) تسرد الأعداد الأولية وfactor(n) عواملها الأولية وgcd وlcm القاسم المشترك الأكبر والمضاعف المشترك الأصغر وsign الإشارة.","x=2.6; y=-2.6;\nfix(x), fix(y)\nfloor(x), floor(y)\nceil(x), ceil(y)\nround(x), round(y)\nprimes(20)\nfactor(60)\ngcd(12,18), lcm(4,6)"],

[`واجب: ناتج حلقتين متداخلتين`,`ما ناتج البرنامج عند n=3 و m=3؟ الحلقة الخارجية i والداخلية j، وكل عنصر result(i,j) = i^j. الجواب: الصف 1: 1 1 1، الصف 2: 2 4 8، الصف 3: 3 9 27.`,`n = 3; m = 3;
for i = 1:n
  for j = 1:m
    result(i,j) = i^j;
  end
end
disp(result)`],
[`واجب: تحويل وحدة إلى سنتمتر`,`برنامج يقرأ عددًا ووحدته (inch، foot، meter، mm) ثم يحوله إلى سنتمترات باستخدام switch. 1 بوصة = 2.54 سم، 1 قدم = 30.48 سم، 1 متر = 100 سم، 1 ملم = 0.1 سم.`,`x = input('Value: ');

v`],

let gsec=0;
function guide(){const t=$('gtabs'),g=$('gbody');t.textContent='';g.textContent='';
 const mk=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=txt;return e};
 G.forEach((s,i)=>{const b=document.createElement('button');b.className='tab';b.textContent=s.t[L()];b.setAttribute('aria-selected',i==gsec);b.onclick=()=>{gsec=i;guide()};t.appendChild(b)});
 const B=BK[gsec],bx=mk('div','bk');bx.dir='rtl';bx.lang='ar';
 bx.append(mk('h3','','ملزمة المراجعة — '+G[gsec].t[1]),mk('p','note',B.o),mk('h3','','شرح الرموز والمعاملات والدوال وقواعد الصياغة'));
 B.r.forEach(r=>{const d=mk('div','gi');d.append(mk('b','code',r[0]),mk('p','',r[1]));if(r[2]){d.append(mk('pre','code gc',r[2]));const tb=mk('button','pri sm','▷ جرّب');tb.style.cssText='margin-block-end:4px';tb.onclick=()=>tryIt(r[2]);d.append(tb)}bx.appendChild(d)});
 g.append(bx)}
function tryIt(code){$('scr').value=code;$('mScr').hidden=false;run(code,true,null)}
function flush(err){['con','sout'].forEach(id=>{const c=$(id);c.textContent=out;if(err){const x=document.createElement('span');x.className='err';x.textContent='Error: '+err;c.appendChild(x)}c.scrollTop=c.scrollHeight})}
function run(code,fresh,echo){if(fresh||!env){env=new Map();fig=newFig();out=''}
 if(echo)out+='>> '+(echo===true?code:echo)+'\n';steps=0;let err=null;plotted=0;
 try{const b=block(split(code),0,[]);exec(b.nodes)}catch(e){err=e.message||String(e)}
 flush(err);try{if(!err&&plotted&&Object.values(fig.axes).some(a=>a.s.length)){$('mFig').hidden=false;render()}else render()}catch(e){flush(String(e.message||e))}}
function showMsg(m,t){$('mt').textContent=t||T[lang].title;$('mm').textContent=m;$('mMsg').hidden=false}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.hidden=true)}
function setLang(l){lang=l;const d=document.documentElement;d.lang=l;d.dir=l=='ar'?'rtl':'ltr';document.title=T[l].title;$('langSel').value=l;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]);
 document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=T[l][e.dataset.p]);
 document.querySelectorAll('[data-ti]').forEach(e=>{e.title=T[l][e.dataset.ti];e.setAttribute('aria-label',T[l][e.dataset.ti])});
 guide();if(fig&&!Object.values(fig.axes).some(a=>a.s.length))render()}
function setTheme(t){document.documentElement.dataset.theme=t;$('themeBtn').textContent=t=='dark'?'☀':'☾';$('thSel').value=t;try{localStorage.setItem('mls-theme',t)}catch(e){}if(fig)render()}
function applySt(){const r=document.documentElement.style;r.setProperty('--fs',ST.fs+'px');r.setProperty('--tc',ST.tc||'inherit');$('fszv').textContent=ST.fs;if(fig)render()}

/* command line: history and multi-line blocks (for/while/if/switch wait for their "end") */
let pend='',hist=[],hp=0;
function go(){const raw=$('cmd').value;if(!raw.trim())return;$('cmd').value='';hist.push(raw);hp=hist.length;
 const code=pend?pend+'\n'+raw:raw;
 try{block(split(code),0,[])}catch(e){if(/Missing 'end'/.test(e.message)){pend=code;out+='>> '+raw+'\n';flush();$('pr').textContent='  ';return}}
 pend='';$('pr').textContent='>>';run(code,false,raw)}
$('cmd').onkeydown=e=>{if(e.key=='Enter')go();else if(e.key=='ArrowUp'&&hp>0){e.preventDefault();$('cmd').value=hist[--hp]}else if(e.key=='ArrowDown'){e.preventDefault();hp=Math.min(hp+1,hist.length);$('cmd').value=hist[hp]||''}};
$('go').onclick=go;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{b.closest('.modal').hidden=true});
document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target==m)m.hidden=true});
$('setBtn').onclick=()=>{$('mSet').hidden=false};
$('guideBtn').onclick=()=>{$('mSet').hidden=true;guide();$('mGuide').hidden=false};
$('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme=='dark'?'light':'dark');
$('thSel').onchange=e=>setTheme(e.target.value);
$('langSel').onchange=e=>setLang(e.target.value);
$('fsz').oninput=e=>{ST.fs=+e.target.value;applySt()};
$('lcol').oninput=e=>{ST.lc=e.target.value;applySt()};$('lreset').onclick=()=>{ST.lc=null;applySt()};
$('tcol').oninput=e=>{ST.tc=e.target.value;applySt()};$('treset').onclick=()=>{ST.tc=null;applySt()};
function runScr(){run($('scr').value,false,null)}
$('scrRun').onclick=runScr;$('scrClr').onclick=()=>{$('scr').value='';$('scr').focus()};
$('scrBtn').onclick=()=>{$('mScr').hidden=false;setTimeout(()=>$('scr').focus(),30)};$('figBtn').onclick=()=>{$('mFig').hidden=false;render()};$('conClr').onclick=()=>{out='';flush();$('cmd').focus()};
$('scr').onkeydown=e=>{if(e.key=='Tab'){e.preventDefault();const t=e.target;t.setRangeText('  ',t.selectionStart,t.selectionEnd,'end')}else if(e.key=='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();runScr()}};
document.addEventListener('keydown',e=>{if(e.key=='Escape'){const v=[...document.querySelectorAll('.modal:not([hidden])')];if(v.length)v[v.length-1].hidden=true}else if(e.key=='F5'&&document.activeElement===$('scr')){e.preventDefault();runScr()}});
try{new ResizeObserver(()=>{try{Plotly.Plots.resize($('plot'))}catch(e){}}).observe($('plot'))}catch(e){}
let th='light';try{th=localStorage.getItem('mls-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}
env=new Map();fig=newFig();setTheme(th);setLang('en');render();$('cmd').focus();
